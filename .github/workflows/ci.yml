name: CI

on:
  pull_request:
    branches: [main, master]
  # Check both branches and build the Mac app when master is updated.
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Bump when ggml/whisper build flags in src-tauri/.cargo/config.toml change —
          # whisper-rs-sys won't rebuild on env changes, so a stale cache keeps old flags.
          prefix-key: v1-ggml-portable

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Stage ONNX Runtime
        run: node scripts/fetch-onnxruntime.mjs

      - name: Rust check
        run: cargo check
        working-directory: src-tauri

  check-macos:
    runs-on: macos-15 # Apple Silicon
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-ggml-portable

      - name: Install dependencies
        run: npm ci

      - name: Stage ONNX Runtime
        run: node scripts/fetch-onnxruntime.mjs

      - name: Rust check
        shell: bash
        working-directory: src-tauri
        run: |
          source ../scripts/macos-env.sh
          cargo check

      - name: Build macOS app and DMG
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: bash ./build-mac.sh --no-install

      - name: Upload macOS Apple Silicon DMG
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: NexQ-macOS-Apple-Silicon
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
